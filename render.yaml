# Render Blueprint for the Cerca backend.
#
# Render watches this file and deploys on every push to the default
# branch, so no CI job is needed — `buildFilter` below keeps a
# Flutter-only commit from triggering a (slow) Rust rebuild.
#
# Postgres is NOT declared here: the database lives on Supabase and its
# Session pooler connection string arrives through DATABASE_URL.
services:
  - type: web
    name: cerca-backend
    runtime: docker
    plan: free
    # Closest free region to Peru; swap if latency proves bad.
    region: oregon
    # Everything below is relative to this, which is why the Dockerfile
    # path has no `backend/` prefix.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Matches the handler in src/routes.rs. Render also uses this to
    # decide when a new deploy is live.
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      # Repo-root relative, unlike the fields above.
      paths:
        - backend/**
    envVars:
      # `sync: false` means "prompt me in the dashboard, don't store it
      # in git" — these are secrets or account-specific.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        # Render generates a long random value once and keeps it stable
        # across deploys. Changing it would invalidate every session.
        generateValue: true
      - key: RUST_LOG
        value: backend=info,tower_http=warn
      # Empty is the safe default: the app is mobile-only, and mobile
      # clients aren't subject to CORS. Fill in only if a web panel appears.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      # Google OAuth client ids accepted in the `aud` claim of an ID token,
      # comma-separated. REQUIRED in production: with it unset the server
      # boots with `UnconfiguredIdentityVerifier` and every /auth/google
      # call answers 503, so the "Continuar con Google" button is dead.
      # Values come from Google Cloud Console → APIs & Services →
      # Credentials (Android package com.salvador.cerca + web client id).
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # S3-compatible bucket for technician documents (Supabase Storage).
      # Until these are set, uploads answer 503 and nothing else breaks.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      # Simulated fee capture until a real PSP is wired. Safe for staging;
      # do NOT combine with APP_ENV=production (the server refuses to boot).
      - key: PAYMENTS_MODE
        value: fake
    # PORT is deliberately absent: Render injects it, and
    # `AppConfig::from_env` already reads it.
