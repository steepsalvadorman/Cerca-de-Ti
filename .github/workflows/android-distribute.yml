name: Distribute Android build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Never ship a build whose tests did not pass.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-distribute:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / riverpod)
        run: dart run build_runner build

      # Without a keystore the APK is debug-signed and cannot be
      # published; Firebase App Distribution still accepts it for
      # testers. Set these secrets to produce a publishable build.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Checked in the shell rather than in `if:` — the secrets context
        # is not reliably available to step conditions.
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          else
            echo "No keystore secret set; the APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        # The API base URL is compile-time. Without it the APK keeps the
        # emulator default (http://10.0.2.2:8080) and cannot reach any
        # backend from a real device — testers got an app that only ever
        # showed connection errors.
        #
        # Passing an EMPTY --dart-define is worse than passing none:
        # String.fromEnvironment would then return "" instead of falling
        # back to the default, so the flag is only added when set.
        run: |
          ARGS="--release --build-number=${{ github.run_number }}"
          if [ -n "$API_BASE_URL" ]; then
            ARGS="$ARGS --dart-define=API_BASE_URL=$API_BASE_URL"
          else
            echo "::warning::API_BASE_URL secret is not set — this APK will point at the emulator default and cannot reach a real backend."
          fi
          flutter build apk $ARGS

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Build automático desde ${{ github.sha }}"
