[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
# Just enough to sign S3-compatible presigned URLs (see
# `r2_object_storage.rs`). All three are already in the tree via
# jsonwebtoken/sqlx, unlike `aws-sdk-s3`, which would pull in the whole
# AWS runtime to do arithmetic we need ~80 lines for.
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.9"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Fetching Google's public signing keys (JWKS) to verify Sign-in with
# Google ID tokens is the only outbound HTTP call this server makes.
# hyper, rustls and webpki-roots are already in the tree via axum and
# sqlx, so this adds the client layer rather than a second TLS stack.
# `webpki-roots` keeps verification independent of the image's CA store.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
# `ServiceExt::oneshot` lets the role-authorization tests drive the real
# router (extractors, auth, status codes included) without binding a port.
tower = { version = "0.5", features = ["util"] }
